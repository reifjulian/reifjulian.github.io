# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you like, you can edit these
# variables in the HTML files where they are accessed via {{ site.title }},
# {{ site.email }}, and so on. You can create any custom variable you would
# like, and they will be accessible in the templates via {{ site.myvariable }}.
title: Julian Reif
email: jreif@illinois.edu
description: >- # this means to ignore newlines until "url:"
  Julian Reif is Associate Professor of Finance and Economics at the University
  of Illinois. His research focuses on the determinants and value of health.
url: https://julianreif.com
locale: en-US
github_username: reifjulian
minimal_mistakes_skin: contrast # dirt # air # default
search: false
repository: reifjulian/reifjulian.github.io

# SEO / social sharing
# Default image used for Open Graph and Twitter/Bluesky link previews
og_image: /assets/images/reif.jpg
og_image_alt: "Photo of Julian Reif"
# Structured data (schema.org Person) emitted on the home page.
# The links become "sameAs" entries, which help search engines connect this
# site to the corresponding profiles. Add ORCID, SSRN, RePEc, NBER, etc. here.
social:
  type: Person
  name: Julian Reif
  links:
    - https://scholar.google.com/citations?user=Tpe9XEcAAAAJ
    - https://github.com/reifjulian
    - https://bsky.app/profile/julianreif.bsky.social
# Site ownership verification codes (paste the value from each console)
google_site_verification: # e.g. "abc123..." from https://search.google.com/search-console
bing_site_verification:   # from https://www.bing.com/webmasters

# There is no blog/feed on this site, so do not advertise /feed.xml in <head>
atom_feed:
  hide: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /:categories/:title/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

# Exclude from processing.
exclude:
  - CLAUDE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Plugins (previously gems:)
plugins:
  - jekyll-sitemap
  - jekyll-include-cache

author:
  name   : "Julian Reif"
  avatar : "/assets/images/reif.jpg"
  bio    : "Associate Professor of Finance and Economics"
  links:    
    - label: "CV"
      icon: "fa fa-fw fa-file-pdf"
      url: "/cv/reif.cv.pdf"
    - label: "Github"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/reifjulian"
    - label: "Google Scholar"
      icon: "fa fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=Tpe9XEcAAAAJ"      
    - label: "Bluesky"
      icon: "fa-brands fa-bluesky"
      url: "https://bsky.app/profile/julianreif.bsky.social"
    - label: "Email"
      icon: "fas fa-envelope"
      url: "mailto:jreif@illinois.edu"
    - label: "Phone"
      icon: "fas fa-phone"
      url: "tel:+12173000169"
#    - label: "Twitter"
#      icon: "fab fa-fw fa-twitter-square"
#      url: "https://twitter.com/JulianReif"

footer:
  links:

defaults:
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false
